<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落字雨：倉頡／速成／英文打字遊戲</title>
<link rel="stylesheet" href="style.css?v=20261125e">
<style>
  #hudBar { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; font-size: 15px; color: #546e7a; margin: 4px 0 10px; }
  #hudBar b { font-size: 20px; color: #263238; }
  #hLives { color: #e53935; font-size: 20px; letter-spacing: 2px; }
  #pauseBtn { margin-left: auto; }
  #field { position: relative; height: 480px; overflow: hidden; background: linear-gradient(#e3f2fd, #fdfdfd 75%); border-radius: 12px; box-shadow: inset 0 0 0 1px #cfd8dc; }
  #field::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: #ef9a9a; }
  #field.hurt { animation: hurt .4s; }
  @keyframes hurt { 30% { box-shadow: inset 0 0 0 6px #e53935; } }
  #field.paused .drop { filter: blur(6px); }
  .drop { position: absolute; top: 0; width: 74px; text-align: center; will-change: transform; }
  .drop .ch { display: inline-block; font-size: 40px; line-height: 1.2; background: #fff; border-radius: 10px; padding: 2px 10px; box-shadow: 0 2px 6px rgba(0,0,0,.15); }
  .drop .hc { display: block; font-size: 13px; color: #607d8b; margin-top: 2px; white-space: nowrap; }
  .drop.pop { animation: pop .45s forwards; }
  @keyframes pop { to { opacity: 0; scale: 1.8; } }
  .drop.pop .ch { background: #c8e6c9; }
  .drop.landed .ch { background: #ffcdd2; }
  .drop.landed { animation: fade .6s forwards; }
  @keyframes fade { to { opacity: 0; } }
  .pts { position: absolute; color: #2e7d32; font-weight: 700; font-size: 16px; pointer-events: none; white-space: nowrap; animation: rise .9s forwards; }
  @keyframes rise { to { opacity: 0; translate: 0 -50px; } }
  #flash { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 700; color: #00897b; opacity: 0; pointer-events: none; }
  #flash.show { animation: flashA 1.2s; }
  @keyframes flashA { 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  #pauseMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; color: #37474f; }
  #overlay { position: absolute; inset: 0; background: rgba(255,255,255,.94); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; text-align: center; font-size: 15px; overflow: auto; }
  #overlay .big { font-size: 30px; font-weight: 700; }
  #ovSetup { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #ovSetup .opt { justify-content: center; margin: 0; }
  #howto { max-width: 640px; line-height: 1.8; font-size: 14px; }
  .sumline b { font-size: 20px; }
  .missed { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 760px; }
  .missed > div:first-child { width: 100%; }
  .mi { border: 1px solid #cfd8dc; border-radius: 8px; padding: 2px 8px; display: flex; flex-direction: column; align-items: center; }
  .mi span { font-size: 28px; }
  .mi small { font-size: 12px; color: #607d8b; }
  #gbar { margin-top: 10px; padding: 10px 16px; display: flex; align-items: center; gap: 16px; min-height: 64px; flex-wrap: wrap; }
  #gbar .lbl { color: #78909c; font-size: 14px; }
  #gmsg { font-size: 14px; color: #c62828; }
  #buf { display: flex; gap: 4px; min-width: 120px; }
  #buf .caret { width: 2px; height: 36px; background: #263238; animation: blink 1s steps(1) infinite; }
  #gcand { font-size: 18px; color: #546e7a; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  #gcand .cd { font-size: 22px; color: #263238; }
  #gcand .cd small { font-size: 12px; color: #90a4ae; margin-right: 2px; }
  #gcand .cd.tgt { background: #ffe082; border-radius: 4px; padding: 0 3px; }
  #gcand .pg { font-size: 13px; color: #90a4ae; }
  body.dark #hudBar { color: #90a4ae; } body.dark #hudBar b { color: #eceff1; }
  body.dark #field { background: linear-gradient(#1a2a33, #161b1e 75%); box-shadow: inset 0 0 0 1px #37474f; }
  body.dark .drop .ch { background: #2c3a40; color: #eceff1; box-shadow: 0 2px 6px rgba(0,0,0,.6); }
  body.dark .drop .hc, body.dark .mi small { color: #90a4ae; }
  body.dark .drop.pop .ch { background: #2e5d32; }
  body.dark .drop.landed .ch { background: #6d2626; }
  body.dark .pts { color: #81c784; }
  body.dark #overlay { background: rgba(21,25,28,.95); }
  body.dark #pauseMsg { color: #cfd8dc; }
  body.dark .mi { border-color: #37474f; }
  body.dark #buf .caret { background: #dde3e6; }
  body.dark #gcand, body.dark #gbar .lbl { color: #90a4ae; }
  body.dark #gcand .cd { color: #eceff1; }
  body.dark #gcand .cd.tgt { background: #5d4c12; }
  body.dark #gmsg { color: #ef9a9a; }
  .drop.en { width: auto; white-space: nowrap; }
  .drop.en .ch { font-family: Consolas, monospace; font-size: 26px; padding: 4px 10px; }
  .drop.en .ch u { color: #00897b; text-decoration-thickness: 3px; }
  .drop.tgt .ch { box-shadow: 0 0 0 2px #4db6ac, 0 2px 6px rgba(0,0,0,.15); }
  .enbuf { font-family: Consolas, monospace; font-size: 26px; letter-spacing: 1px; }
  body.dark .drop.en .ch u { color: #80cbc4; }
  @media (max-width: 820px) { #field { height: 400px; } }
</style>
</head>
<body>
<header>
  <h1>落字雨<small>倉頡／速成／英文打字遊戲</small></h1>
  <button id="themeBtn">🌙 深色</button>
  <a class="ver" id="backLink" href="index.html">← 回倉頡練習</a>
</header>
<main>
  <div id="imeWarn" hidden>偵測到系統輸入法正在組字。請先把輸入法切換成<b>英文</b>，網頁會自己模擬倉頡／速成。</div>
  <div id="hudBar">
    <span>分數 <b id="hScore">0</b></span>
    <span>關卡 <b id="hLevel">1</b></span>
    <span>連擊 <b id="hCombo">0</b></span>
    <span>生命 <span id="hLives"></span></span>
    <span>最高分 <b id="hBest">0</b></span>
    <button class="btn" id="pauseBtn" hidden>⏸ 暫停</button>
  </div>
  <div id="field">
    <div id="flash"></div>
    <div id="pauseMsg" hidden>已暫停　按 Esc、Enter 或「繼續」回到遊戲</div>
    <div id="overlay">
      <div id="ovBody"></div>
      <div id="ovSetup">
        <div class="opt">
          輸入法 <select id="ime"></select>
          字的範圍 <select id="range"></select>
          速度 <select id="speed"></select>
        </div>
        <div class="opt">
          <label id="hintLbl"><input type="checkbox" id="hint"> 在字下面顯示拆碼提示（新手適用）</label>
          <label><input type="checkbox" id="sound"> 音效</label>
        </div>
        <div id="howto"></div>
        <button class="btn primary" id="startBtn">開始遊戲（Enter）</button>
      </div>
    </div>
  </div>
  <div id="gbar" class="card">
    <span class="lbl">已打的碼</span>
    <div id="buf"></div>
    <div id="gcand"></div>
    <span id="gmsg"></span>
  </div>
  <footer>每消除 10 個字升一關，字會落得更快、更密。連擊越多分數越高。字碼資料：rime-cangjie（GPL）；速成候選次序：quick-classic（GPL），並按微軟速成調整。</footer>
</main>
<script src="cangjie-data.js?v=20261125e"></script>
<script src="en-data.js?v=20261125e"></script>
<script src="game.js?v=20261125e"></script>
</body>
</html>
